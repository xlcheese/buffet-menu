<?xml version="1.0" encoding="UTF-8"?>
<!-- Buffet Menu: a cafeteria tray, its compartments like the menus side by side -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8c2"/>
      <stop offset="1" stop-color="#9bd6a2"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6eb579"/>
      <stop offset="1" stop-color="#8ccb94"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <rect x="6" y="20" width="120" height="96" rx="14" fill="#000" opacity="0.2"/>
  <!-- the tray -->
  <rect x="3" y="16" width="120" height="96" rx="14" fill="url(#tray)" stroke="#4f9058" stroke-width="3"/>
  <g fill="url(#well)" stroke="#4f9058" stroke-width="2.5">
    <!-- the long one on the left -->
    <rect x="12" y="25" width="15" height="78" rx="7.5"/>
    <!-- three along the top -->
    <rect x="33" y="25" width="24" height="33" rx="5"/>
    <rect x="63" y="25" width="24" height="33" rx="5"/>
    <rect x="93" y="25" width="21" height="33" rx="5"/>
    <!-- a round dish, and the big one -->
    <circle cx="50" cy="83" r="19"/>
    <rect x="76" y="64" width="38" height="39" rx="6"/>
  </g>
  <!-- the cup ring in the top right one -->
  <circle cx="103.5" cy="41.5" r="7.5" fill="none" stroke="#4f9058" stroke-width="2" opacity="0.7"/>
</svg>
