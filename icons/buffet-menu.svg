<?xml version="1.0" encoding="UTF-8"?>
<!-- Buffet Menu: a cafeteria tray, its compartments like the menus side by side -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde7c1"/>
      <stop offset="1" stop-color="#a3d8a8"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73b97d"/>
      <stop offset="1" stop-color="#84c58c"/>
    </linearGradient>
  </defs>
  <!-- a soft shadow below -->
  <rect x="9" y="12" width="110" height="110" rx="24" fill="#000" opacity="0.3" filter="url(#shadow)"/>
  <!-- the tray: its rim, thicker along the top and bottom like a tray's lip -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#4f9058"/>
  <rect x="10" y="16" width="108" height="98" rx="20" fill="url(#tray)"/>
  <!-- a light edge under the top rim -->
  <path d="M 30 17 h 68" stroke="#d6f1d8" stroke-width="2" stroke-linecap="round"/>
  <g fill="url(#well)" stroke="#4f9058" stroke-width="2.5">
    <!-- the long one on the left -->
    <rect x="19.5" y="26.5" width="15" height="76" rx="7.5"/>
    <!-- three along the top -->
    <rect x="40.5" y="26.5" width="22" height="31" rx="5"/>
    <rect x="68.5" y="26.5" width="22" height="31" rx="5"/>
    <rect x="96.5" y="26.5" width="13" height="31" rx="5"/>
    <!-- a round dish, and the big one -->
    <circle cx="56.5" cy="83.5" r="18"/>
    <rect x="80.5" y="64.5" width="29" height="38" rx="5"/>
  </g>
</svg>
